<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Dark Navy Background -->
  <rect width="800" height="200" rx="12" fill="#0D1B3D"/>
  
  <!-- SF Icon -->
  <g transform="translate(30, 20)">
    <!-- SF Box -->
    <rect x="0" y="0" width="100" height="110" rx="8" fill="#0D1B3D" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    
    <!-- S Letter -->
    <text x="10" y="85" font-family="Arial Black, Arial" font-weight="900" font-size="80" fill="#FFFFFF">S</text>
    
    <!-- F Letter in Red -->
    <text x="50" y="85" font-family="Arial Black, Arial" font-weight="900" font-size="80" fill="#E30613">F</text>
    
    <!-- Newspaper mini icon -->
    <g transform="translate(40, -10)">
      <rect x="0" y="0" width="60" height="35" rx="3" fill="#E6E8EB"/>
      <line x1="5" y1="10" x2="30" y2="10" stroke="#0D1B3D" stroke-width="1.5"/>
      <line x1="5" y1="16" x2="55" y2="16" stroke="#0D1B3D" stroke-width="1"/>
      <line x1="5" y1="21" x2="55" y2="21" stroke="#0D1B3D" stroke-width="1"/>
      <line x1="5" y1="26" x2="40" y2="26" stroke="#0D1B3D" stroke-width="1"/>
    </g>
    
    <!-- Mini landscape -->
    <g transform="translate(-10, 70)">
      <ellipse cx="55" cy="60" rx="65" ry="35" fill="#1E7A3A" opacity="0.8"/>
      <path d="M 0 60 Q 20 45 40 55 Q 60 45 80 52 Q 100 48 110 55 L 110 80 L 0 80 Z" fill="#1E7A3A"/>
      <path d="M 5 65 Q 25 55 50 62 Q 75 55 100 60 L 100 80 L 5 80 Z" fill="#2d9b4e"/>
      <!-- Road -->
      <path d="M 48 80 L 51 60 L 57 60 L 60 80 Z" fill="#E6E8EB" opacity="0.5"/>
      <!-- Birds -->
      <path d="M 75 40 Q 78 36 81 40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M 85 36 Q 88 32 91 36" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Divider line -->
  <line x1="170" y1="40" x2="170" y2="160" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
  
  <!-- Brand Name -->
  <g transform="translate(195, 50)">
    <text x="0" y="40" font-family="Arial Black, Arial" font-weight="900" font-size="48" fill="#FFFFFF">Shotto</text>
    <text x="220" y="40" font-family="Arial Black, Arial" font-weight="900" font-size="48" fill="#E30613">Feed</text>
  </g>
  
  <!-- Bengali Tagline -->
  <g transform="translate(195, 105)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#E30613" stroke-width="2"/>
    <text x="50" y="15" font-family="'Noto Sans Bengali', 'Kalpurush', sans-serif" font-size="18" fill="#FFFFFF" xml:lang="bn">&#x09B8;&#x09A4;&#x09CD;&#x09AF;&#x09C7;&#x09B0; &#x0996;&#x09AC;&#x09B0;, &#x09B8;&#x09AC;&#x09BE;&#x09B0; &#x0986;&#x0997;&#x09C7;</text>
    <line x1="320" y1="10" x2="360" y2="10" stroke="#E30613" stroke-width="2"/>
  </g>
  
  <!-- Category Tags -->
  <g transform="translate(195, 145)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="#E6E8EB" letter-spacing="2">NEWS</text>
    <circle cx="60" cy="-4" r="2.5" fill="#E30613"/>
    <text x="72" y="0" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="#E6E8EB" letter-spacing="2">FACT CHECK</text>
    <circle cx="195" cy="-4" r="2.5" fill="#E30613"/>
    <text x="207" y="0" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="#E6E8EB" letter-spacing="2">SYLHET FOCUS</text>
  </g>
</svg>
