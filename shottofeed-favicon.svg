<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="80" fill="#FFFFFF"/>
  <rect x="4" y="4" width="504" height="504" rx="76" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="4"/>
  
  <!-- SF Monogram -->
  <g transform="translate(60, 50)">
    <!-- Dark blue block behind SF -->
    <rect x="20" y="20" width="350" height="280" rx="20" fill="#0D1B3D"/>
    
    <!-- S Letter -->
    <text x="60" y="240" font-family="Arial Black, Arial" font-weight="900" font-size="250" fill="#FFFFFF">S</text>
    
    <!-- F Letter in Red -->
    <text x="200" y="240" font-family="Arial Black, Arial" font-weight="900" font-size="250" fill="#E30613">F</text>
  </g>
  
  <!-- Newspaper icon on top right -->
  <g transform="translate(280, 20)">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#E6E8EB" stroke="#0D1B3D" stroke-width="3"/>
    <rect x="6" y="6" width="128" height="68" rx="4" fill="#FFFFFF"/>
    <line x1="14" y1="22" x2="60" y2="22" stroke="#0D1B3D" stroke-width="3"/>
    <line x1="14" y1="34" x2="120" y2="34" stroke="#0D1B3D" stroke-width="2"/>
    <line x1="14" y1="44" x2="120" y2="44" stroke="#0D1B3D" stroke-width="2"/>
    <line x1="14" y1="54" x2="120" y2="54" stroke="#0D1B3D" stroke-width="2"/>
    <line x1="14" y1="64" x2="80" y2="64" stroke="#0D1B3D" stroke-width="2"/>
    <!-- Folded corner -->
    <polygon points="110,0 140,0 140,30" fill="#c0c4c8"/>
  </g>
  
  <!-- Sylhet landscape at bottom -->
  <g transform="translate(0, 340)">
    <!-- Green hills -->
    <ellipse cx="256" cy="120" rx="240" ry="80" fill="#1E7A3A"/>
    <path d="M 30 100 Q 80 70 140 90 Q 200 70 260 85 Q 320 65 380 80 Q 440 70 490 90 L 512 100 L 512 172 L 0 172 Z" fill="#1E7A3A"/>
    <path d="M 50 120 Q 120 95 200 110 Q 280 95 360 108 Q 420 95 480 110 L 512 120 L 512 172 L 0 172 Z" fill="#2d9b4e"/>
    
    <!-- Road/path -->
    <path d="M 240 172 L 248 100 L 264 100 L 272 172 Z" fill="#E6E8EB" opacity="0.6"/>
    
    <!-- City silhouette -->
    <g fill="#0D1B3D" opacity="0.4">
      <rect x="200" y="65" width="10" height="45"/>
      <polygon points="200,65 205,52 210,65"/>
      <!-- Bridge -->
      <path d="M 100 95 Q 130 82 160 95 Q 190 82 220 95" fill="none" stroke="#0D1B3D" stroke-width="2.5" opacity="0.4"/>
    </g>
    
    <!-- Birds -->
    <path d="M 350 60 Q 358 50 366 60" fill="none" stroke="#0D1B3D" stroke-width="2.5"/>
    <path d="M 380 50 Q 388 40 396 50" fill="none" stroke="#0D1B3D" stroke-width="2.5"/>
    <path d="M 400 58 Q 406 50 412 58" fill="none" stroke="#0D1B3D" stroke-width="2"/>
  </g>
</svg>
